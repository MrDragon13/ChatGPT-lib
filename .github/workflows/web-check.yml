name: Web Check

on:
  pull_request:
    paths:
      - 'web/**'
      - 'media/service/web_export.py'
      - 'media/schemas/web-manifest.schema.json'
      - 'media/cli.py'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install -r media/requirements.txt
      - name: Export real web manifest
        run: python -m media.cli web-export --output web/public/data/manifest.json --format json
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Run web tests
        working-directory: web
        run: npm run test:run
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Commit generated lockfile once
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- web/package-lock.json && git ls-files --error-unmatch web/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json
          git commit -m 'build: lock web dependencies'
          git push origin HEAD:${{ github.head_ref }}
