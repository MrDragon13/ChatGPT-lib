name: Web Check

on:
  pull_request:
    paths:
      - 'web/**'
      - 'media/service/web_export.py'
      - 'media/schemas/web-manifest.schema.json'
      - 'media/cli.py'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install -r media/requirements.txt
      - name: Export real web manifest
        run: python -m media.cli web-export --output web/public/data/manifest.json --format json
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
      - name: Install web dependencies
        working-directory: web
        run: npm install
      - name: Run web tests
        working-directory: web
        run: npm run test:run
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: web/package-lock.json
          if-no-files-found: error
