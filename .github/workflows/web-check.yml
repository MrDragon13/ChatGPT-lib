name: Web Check

on:
  pull_request:
    paths:
      - 'web/**'
      - 'media/service/web_export.py'
      - 'media/schemas/web-manifest.schema.json'
      - 'media/cli.py'
      - '.github/workflows/web-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install -r media/requirements.txt
      - name: Export real web manifest
        run: python -m media.cli web-export --output web/public/data/manifest.json --format json
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run web tests
        working-directory: web
        run: npm run test:run
      - name: Typecheck web
        working-directory: web
        run: npm run typecheck
      - name: Build web
        working-directory: web
        run: npm run build
      - name: Install Chromium for browser checks
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run responsive and motion browser checks
        working-directory: web
        run: npm run test:e2e -- responsive.spec.ts motion.spec.ts
