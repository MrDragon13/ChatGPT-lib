name: TEMP Finalize Reassessment Activation

on:
  push:
    branches:
      - feat/media-legacy-reassessment-activation
    paths:
      - '.github/workflows/tmp-reassessment-ledger.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify committed ledger bytes
        run: |
          echo "a401526355a629faf2d0559f9ad4346449dd86d97e649a4d13489f3d3f471b2f  media/pilots/legacy-reassessment-primary.json" | sha256sum -c -
      - name: Update activation documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          status_path = Path('docs/status/current.md')
          status = status_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '### Legacy reassessment foundation',
                  '### Legacy reassessment pilot',
              ),
              (
                  'Фундамент pilot переоценки legacy `primary` reviews реализован в PR A, но сам pilot **not activated / ещё не активирован** до отдельного manual PR B с frozen ledger. Approved frozen Stage A revision: `35afaca898eae6937066f230906b41af0e1f6690`.',
                  'Pilot переоценки legacy `primary` reviews **активирован** отдельным manual PR B. Frozen Stage A revision: `35afaca898eae6937066f230906b41af0e1f6690`; frozen cohort содержит **55 works**: `23 central`, `10 high`, `10 low`, `9 medium_low`, `3 special`. На старте все 55 items имеют `pending`, sessions пусты.',
              ),
              (
                  'Foundation включает neutral/unanchored `reassessment-context`, отдельный opt-in `reassessment-history`, typed `reserve_reassessment_session` / `complete_reassessment_item` / `close_reassessment_session`, atomic feedback+ledger completion, current-ledger/work digests, monotonic transition validation и trusted workflow guards. Default session size — 5; scheduled inferred-hypothesis reanalysis — каждые 15 newly reviewed works и в конце main pending pass.',
                  'Runtime foundation включает neutral/unanchored `reassessment-context`, отдельный opt-in `reassessment-history`, typed `reserve_reassessment_session` / `complete_reassessment_item` / `close_reassessment_session`, atomic feedback+ledger completion, current-ledger/work digests, monotonic transition validation и trusted workflow guards. Default session size — 5; scheduled inferred-hypothesis reanalysis — каждые 15 newly reviewed works и в конце main pending pass.',
              ),
              (
                  '- Legacy reassessment foundation не означает активный pilot: frozen cohort/ledger будет создан только отдельным activation PR после manual review/merge PR A и successful exact-revision developer gate.',
                  '- Legacy reassessment pilot активен, но первая durable reservation создаётся только при фактическом старте пользовательской сессии; smoke test не должен случайно потребить batch. Semantic fingerprint backfill остаётся отдельным будущим циклом.',
              ),
          ]
          for old, new in replacements:
              if old not in status:
                  raise SystemExit(f'missing expected status text: {old[:80]}')
              status = status.replace(old, new, 1)
          status_path.write_text(status, encoding='utf-8')

          runbook_path = Path('docs/runbooks/media-legacy-reassessment.md')
          runbook = runbook_path.read_text(encoding='utf-8')
          old_status = 'Status in PR A: **foundation implemented; pilot not activated**. The durable pilot ledger is created only by the separate manual activation PR after this foundation is reviewed and merged.'
          new_status = 'Status: **pilot activated**. PR A foundation is merged; PR B installs the frozen ledger at `media/pilots/legacy-reassessment-primary.json`. No user item is reserved merely by activation.'
          if old_status not in runbook:
              raise SystemExit('missing expected runbook status')
          runbook = runbook.replace(old_status, new_status, 1)
          anchor = 'The frozen comparison point is Stage A revision `35afaca898eae6937066f230906b41af0e1f6690` and `media/baselines/intelligence-stage-a.json`. Progress and later quality comparisons use that frozen Stage A baseline, not yesterday\'s generated profile.\n'
          activation = '''The frozen comparison point is Stage A revision `35afaca898eae6937066f230906b41af0e1f6690` and `media/baselines/intelligence-stage-a.json`. Progress and later quality comparisons use that frozen Stage A baseline, not yesterday's generated profile.\n\n## Activation snapshot\n\nThe activated frozen cohort contains **55 works**: `23 central`, `10 high`, `10 low`, `9 medium_low`, and `3 special`. Initial lifecycle state is `55 pending`, `0 sessions`; ledger SHA-256 is `a401526355a629faf2d0559f9ad4346449dd86d97e649a4d13489f3d3f471b2f`. The Stage A canonical input digest remains `sha256:98e9dc4521e69ee5273e302fc40cc1e5fc3d53b119e2c7637475ac45cce43fbf`.\n\nThe first frozen-order batch is `gattaca-1997`, `grand-budapest-hotel-2014`, `source-code-2011`, `project-hail-mary`, `interstellar-2014`. Do **not** reserve it during smoke testing; reserve only when the user is actually starting session 1. The first response for every item remains unanchored.\n'''
          if anchor not in runbook:
              raise SystemExit('missing expected runbook baseline anchor')
          runbook = runbook.replace(anchor, activation, 1)
          runbook_path.write_text(runbook, encoding='utf-8')
          PY
      - name: Commit docs and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-reassessment-ledger.yml
          git add docs/status/current.md docs/runbooks/media-legacy-reassessment.md
          git commit -m "docs: mark legacy reassessment pilot active"
          git push origin HEAD:feat/media-legacy-reassessment-activation
