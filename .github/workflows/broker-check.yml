name: Broker Check

on:
  pull_request:
    paths:
      - 'broker/**'
      - '.github/workflows/broker-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - name: Install broker dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v6
        with:
          name: broker-package-lock
          path: broker/package-lock.json
      - name: Run broker tests
        run: npm run test:run
      - name: Typecheck broker
        run: npm run typecheck
