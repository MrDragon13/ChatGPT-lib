name: Media Auto Merge
run-name: Media Auto Merge · ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: [Media Check]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: media-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge-normal-data-operation:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.head_branch, 'media/op-')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and verify eligible PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          match_policy_path() {
            local path="$1"
            local pattern="$2"
            local stripped star_count prefix suffix middle_length middle
            local segment
            local -a segments

            if [ -z "$path" ] || [ -z "$pattern" ]; then
              return 2
            fi
            if [[ "$path" == /* || "$pattern" == /* || "$path" == */ || "$pattern" == */ ]]; then
              return 2
            fi
            if [[ "$path" == *'\\'* || "$pattern" == *'\\'* || "$path" == *'//'* || "$pattern" == *'//'* ]]; then
              return 2
            fi
            case "$pattern" in
              *'?'*|*'['*|*']'*|*'{'*|*'}'*) return 2 ;;
            esac

            IFS='/' read -r -a segments <<< "$path"
            for segment in "${segments[@]}"; do
              if [ -z "$segment" ] || [ "$segment" = "." ] || [ "$segment" = ".." ]; then
                return 2
              fi
            done
            IFS='/' read -r -a segments <<< "$pattern"
            for segment in "${segments[@]}"; do
              if [ -z "$segment" ] || [ "$segment" = "." ] || [ "$segment" = ".." ]; then
                return 2
              fi
            done

            stripped="${pattern//\*/}"
            star_count=$(( ${#pattern} - ${#stripped} ))
            if [ "$star_count" -gt 1 ]; then
              return 2
            fi
            if [ "$star_count" -eq 0 ]; then
              [ "$path" = "$pattern" ]
              return
            fi

            prefix="${pattern%%\**}"
            suffix="${pattern#*\*}"
            if [[ "$path" != "$prefix"* ]]; then
              return 1
            fi
            if [ -n "$suffix" ] && [[ "$path" != *"$suffix" ]]; then
              return 1
            fi
            if [ "${#path}" -lt $(( ${#prefix} + ${#suffix} )) ]; then
              return 1
            fi
            middle_length=$(( ${#path} - ${#prefix} - ${#suffix} ))
            middle="${path:${#prefix}:$middle_length}"
            if [[ "$middle" == */* ]]; then
              return 1
            fi
            return 0
          }

          OWNER="${REPO%%/*}"
          mapfile -t PR_ROWS < <(
            gh api --method GET "repos/$REPO/pulls" \
              -f state=open \
              -f base=main \
              -f head="$OWNER:$HEAD_BRANCH" \
              --jq '.[] | [.number, .head.sha, .head.repo.full_name, .base.ref] | @tsv'
          )

          if [ "${#PR_ROWS[@]}" -eq 0 ]; then
            echo "No open operation PR remains; nothing to merge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#PR_ROWS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one open PR for $HEAD_BRANCH"
            exit 2
          fi

          IFS=$'\t' read -r PR_NUMBER PR_HEAD_SHA PR_HEAD_REPO PR_BASE <<< "${PR_ROWS[0]}"
          if [ "$PR_HEAD_REPO" != "$REPO" ] || [ "$PR_BASE" != "main" ]; then
            echo "::error::Only same-repository operation PRs targeting main are eligible"
            exit 3
          fi
          if [ "$PR_HEAD_SHA" != "$CHECKED_SHA" ]; then
            echo "::error::Media Check head does not match current PR head: checked=$CHECKED_SHA pr=$PR_HEAD_SHA"
            exit 3
          fi


          COMMIT_ACTOR=$(gh api "repos/$REPO/commits/$PR_HEAD_SHA" --jq '.author.login // empty')
          if [ "$COMMIT_ACTOR" != "github-actions[bot]" ]; then
            echo "::error::Operation head was not produced by the trusted command workflow"
            exit 3
          fi

          mapfile -t FILES < <(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::Operation PR has no changed files"
            exit 3
          fi

          OP_MARKERS=()
          for path in "${FILES[@]}"; do
            if match_policy_path "$path" ".media/operations/*.json"; then
              OP_MARKERS+=("$path")
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "::error::Invalid repository path in PR metadata: $path"
                exit 3
              fi
            fi
          done
          if [ "${#OP_MARKERS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one applied operation marker"
            exit 3
          fi

          OP_JSON=$(gh api "repos/$REPO/contents/${OP_MARKERS[0]}?ref=$PR_HEAD_SHA" --jq '.content' | tr -d '\n' | base64 --decode)
          if ! OP_STATUS=$(printf '%s' "$OP_JSON" | jq -er '.status'); then
            echo "::error::Operation marker has no valid status"
            exit 3
          fi
          if ! OP_KIND=$(printf '%s' "$OP_JSON" | jq -er '.operation'); then
            echo "::error::Operation marker has no valid operation kind"
            exit 3
          fi
          TRUSTED_NO_CHANGE_OPERATION=false
          if [ "$OP_KIND" = "refresh_work_metadata" ] || [ "$OP_KIND" = "set_semantic_fingerprint" ]; then
            TRUSTED_NO_CHANGE_OPERATION=true
          fi
          if [ "$OP_STATUS" != "applied" ] && ! { [ "$OP_STATUS" = "no_change" ] && [ "$TRUSTED_NO_CHANGE_OPERATION" = true ]; }; then
            echo "::error::Operation marker has an ineligible status: $OP_STATUS"
            exit 3
          fi

          POLICY_JSON=$(gh api "repos/$REPO/contents/media/config/operation_path_policy.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)
          if ! printf '%s' "$POLICY_JSON" | jq -e '
            .schema_version == 1 and
            (.operations | type == "object") and
            (.operations | length > 0)
          ' >/dev/null; then
            echo "::error::Trusted main operation path policy is invalid"
            exit 3
          fi

          if ! OP_POLICY=$(printf '%s' "$POLICY_JSON" | jq -ce --arg op "$OP_KIND" '.operations[$op] // empty'); then
            echo "::error::Operation kind is absent from trusted main policy: $OP_KIND"
            exit 3
          fi
          if printf '%s' "$OP_POLICY" | jq -e '.execution_class == "v6_single_runner"' >/dev/null; then
            echo "::error::v6 single-runner operations must merge inside Media Command"
            exit 3
          fi
          if ! printf '%s' "$OP_POLICY" | jq -e '
            .auto_merge == true and
            (.allowed_paths | type == "array") and
            (.allowed_paths | length > 0) and
            ([.allowed_paths[] | select(type != "string" or length == 0)] | length == 0)
          ' >/dev/null; then
            echo "::error::Operation is not eligible under trusted main policy: $OP_KIND"
            exit 3
          fi

          mapfile -t ALLOWED_PATHS < <(printf '%s' "$OP_POLICY" | jq -r '.allowed_paths[]')
          for pattern in "${ALLOWED_PATHS[@]}"; do
            if match_policy_path "__policy_validation_probe__" "$pattern"; then
              :
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "::error::Trusted main policy contains unsupported path pattern: $pattern"
                exit 3
              fi
            fi
          done

          for path in "${FILES[@]}"; do
            matched=false
            for pattern in "${ALLOWED_PATHS[@]}"; do
              if match_policy_path "$path" "$pattern"; then
                matched=true
                break
              else
                rc=$?
                if [ "$rc" -eq 2 ]; then
                  echo "::error::Invalid repository path or trusted policy pattern: $path / $pattern"
                  exit 3
                fi
              fi
            done
            if [ "$matched" != true ]; then
              echo "::error::$OP_KIND may not auto-merge path under trusted main policy: $path"
              exit 3
            fi
          done

          # Pilot stale-state and work-file guards. Eligibility still comes from trusted main policy above.
          PILOT_OPERATION=false
          if [ "$OP_KIND" = "reserve_reassessment_session" ] || \
             [ "$OP_KIND" = "complete_reassessment_item" ] || \
             [ "$OP_KIND" = "close_reassessment_session" ] || \
             [ "$OP_KIND" = "record_reassessment_modernization" ]; then
            PILOT_OPERATION=true
          fi

          if [ "$PILOT_OPERATION" = true ]; then
            LEDGER_PATH="media/pilots/legacy-reassessment-primary.json"
            LEDGER_COUNT=0
            WORK_FILES=()
            for path in "${FILES[@]}"; do
              if [ "$path" = "$LEDGER_PATH" ]; then
                LEDGER_COUNT=$((LEDGER_COUNT + 1))
              fi
              if match_policy_path "$path" "media/data/works/*.yaml"; then
                WORK_FILES+=("$path")
              else
                rc=$?
                if [ "$rc" -eq 2 ]; then
                  echo "::error::Invalid work path while checking pilot operation: $path"
                  exit 3
                fi
              fi
            done
            if [ "$LEDGER_COUNT" -ne 1 ]; then
              echo "::error::Pilot operation must change the exact reassessment ledger once"
              exit 3
            fi

            EXPECTED_LEDGER_DIGEST=$(printf '%s' "$OP_JSON" | jq -er '.details.expected_ledger_digest')
            if ! CURRENT_LEDGER_B64=$(gh api "repos/$REPO/contents/media/pilots/legacy-reassessment-primary.json?ref=main" --jq '.content'); then
              echo "::error::Current-main reassessment ledger is missing"
              exit 3
            fi
            printf '%s' "$CURRENT_LEDGER_B64" | tr -d '\n' | base64 --decode > /tmp/current-reassessment-ledger.json
            CURRENT_LEDGER_DIGEST="sha256:$(sha256sum /tmp/current-reassessment-ledger.json | awk '{print $1}')"
            if [ "$CURRENT_LEDGER_DIGEST" != "$EXPECTED_LEDGER_DIGEST" ]; then
              if [ "$OP_KIND" = "record_reassessment_modernization" ]; then
                echo "::error::Stale reassessment ledger during modernization: planned=$EXPECTED_LEDGER_DIGEST current=$CURRENT_LEDGER_DIGEST"
              else
                echo "::error::Stale reassessment ledger: planned=$EXPECTED_LEDGER_DIGEST current=$CURRENT_LEDGER_DIGEST"
              fi
              exit 3
            fi

            if [ "$OP_KIND" = "reserve_reassessment_session" ]; then
              if [ "${#WORK_FILES[@]}" -ne 0 ]; then
                echo "::error::reserve_reassessment_session may not change canonical work files"
                exit 3
              fi
              if ! printf '%s' "$OP_JSON" | jq -e '
                (.details.reserved_items | type == "object") and
                (.details.reserved_items | length > 0) and
                all(.details.reserved_items[];
                  .pre_review_work_file_digest
                  | (type == "string" and test("^sha256:[0-9a-f]{64}$"))
                )
              ' >/dev/null; then
                echo "::error::reserve_reassessment_session receipt has malformed reserved_items"
                exit 3
              fi
              while IFS=$'\t' read -r WORK_ID EXPECTED_WORK_DIGEST; do
                if [[ ! "$WORK_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                  echo "::error::Invalid reserved work id in receipt: $WORK_ID"
                  exit 3
                fi
                if ! CURRENT_WORK_B64=$(gh api "repos/$REPO/contents/media/data/works/$WORK_ID.yaml?ref=main" --jq '.content'); then
                  echo "::error::Reserved current-main work file is missing: $WORK_ID"
                  exit 3
                fi
                printf '%s' "$CURRENT_WORK_B64" | tr -d '\n' | base64 --decode > /tmp/current-reassessment-work.yaml
                CURRENT_WORK_DIGEST="sha256:$(sha256sum /tmp/current-reassessment-work.yaml | awk '{print $1}')"
                if [ "$CURRENT_WORK_DIGEST" != "$EXPECTED_WORK_DIGEST" ]; then
                  echo "::error::Stale reserved work during reassessment reservation: work=$WORK_ID planned=$EXPECTED_WORK_DIGEST current=$CURRENT_WORK_DIGEST"
                  exit 3
                fi
              done < <(printf '%s' "$OP_JSON" | jq -r '.details.reserved_items | to_entries[] | [.key, .value.pre_review_work_file_digest] | @tsv')
            elif [ "$OP_KIND" = "complete_reassessment_item" ]; then
              if [ "${#WORK_FILES[@]}" -gt 1 ]; then
                echo "::error::complete_reassessment_item may change at most one work"
                exit 3
              fi
              WORK_ID=$(printf '%s' "$OP_JSON" | jq -er '.details.work_id')
              if [[ ! "$WORK_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
                echo "::error::Invalid reserved work id in completion receipt: $WORK_ID"
                exit 3
              fi
              EXPECTED_WORK_PATH="media/data/works/$WORK_ID.yaml"
              if [ "${#WORK_FILES[@]}" -eq 1 ] && [ "${WORK_FILES[0]}" != "$EXPECTED_WORK_PATH" ]; then
                echo "::error::Changed work does not match reserved work path: expected=$EXPECTED_WORK_PATH actual=${WORK_FILES[0]}"
                exit 3
              fi
              EXPECTED_WORK_DIGEST=$(printf '%s' "$OP_JSON" | jq -er '.details.pre_review_work_file_digest')
              if ! CURRENT_WORK_B64=$(gh api "repos/$REPO/contents/media/data/works/$WORK_ID.yaml?ref=main" --jq '.content'); then
                echo "::error::Reserved current-main work file is missing: $WORK_ID"
                exit 3
              fi
              printf '%s' "$CURRENT_WORK_B64" | tr -d '\n' | base64 --decode > /tmp/current-reassessment-work.yaml
              CURRENT_WORK_DIGEST="sha256:$(sha256sum /tmp/current-reassessment-work.yaml | awk '{print $1}')"
              if [ "$CURRENT_WORK_DIGEST" != "$EXPECTED_WORK_DIGEST" ]; then
                echo "::error::Stale reserved work file: planned=$EXPECTED_WORK_DIGEST current=$CURRENT_WORK_DIGEST"
                exit 3
              fi
            else
              if [ "${#WORK_FILES[@]}" -ne 0 ]; then
                echo "::error::$OP_KIND may not change canonical work files"
                exit 3
              fi
            fi
          fi

          if [ "$OP_KIND" = "refresh_work_metadata" ]; then
            WORK_ID=$(printf '%s' "$OP_JSON" | jq -er '.details.work_id')
            EXPECTED_WORK_DIGEST=$(printf '%s' "$OP_JSON" | jq -er '.details.expected_work_digest')
            if [[ ! "$WORK_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::Invalid work id in metadata modernization receipt: $WORK_ID"
              exit 3
            fi
            if ! CURRENT_WORK_B64=$(gh api "repos/$REPO/contents/media/data/works/$WORK_ID.yaml?ref=main" --jq '.content'); then
              echo "::error::Current-main work is missing during metadata modernization: $WORK_ID"
              exit 3
            fi
            printf '%s' "$CURRENT_WORK_B64" | tr -d '\n' | base64 --decode > /tmp/current-modernization-work.yaml
            CURRENT_WORK_DIGEST="sha256:$(sha256sum /tmp/current-modernization-work.yaml | awk '{print $1}')"
            if [ "$CURRENT_WORK_DIGEST" != "$EXPECTED_WORK_DIGEST" ]; then
              echo "::error::Stale work during metadata modernization: work=$WORK_ID planned=$EXPECTED_WORK_DIGEST current=$CURRENT_WORK_DIGEST"
              exit 3
            fi
          fi

          if [ "$OP_KIND" = "record_reassessment_modernization" ]; then
            WORK_ID=$(printf '%s' "$OP_JSON" | jq -er '.details.work_id')
            EXPECTED_WORK_DIGEST=$(printf '%s' "$OP_JSON" | jq -er '.details.expected_work_digest')
            if [[ ! "$WORK_ID" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::Invalid work id in modernization marker receipt: $WORK_ID"
              exit 3
            fi
            if ! CURRENT_WORK_B64=$(gh api "repos/$REPO/contents/media/data/works/$WORK_ID.yaml?ref=main" --jq '.content'); then
              echo "::error::Current-main work is missing during modernization marker: $WORK_ID"
              exit 3
            fi
            printf '%s' "$CURRENT_WORK_B64" | tr -d '\n' | base64 --decode > /tmp/current-modernization-marker-work.yaml
            CURRENT_WORK_DIGEST="sha256:$(sha256sum /tmp/current-modernization-marker-work.yaml | awk '{print $1}')"
            if [ "$CURRENT_WORK_DIGEST" != "$EXPECTED_WORK_DIGEST" ]; then
              echo "::error::Stale work during modernization marker: work=$WORK_ID planned=$EXPECTED_WORK_DIGEST current=$CURRENT_WORK_DIGEST"
              exit 3
            fi
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$CHECKED_SHA" >> "$GITHUB_OUTPUT"

      - name: Merge verified normal data operation
        id: merge
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          RESPONSE=$(gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$EXPECTED_SHA" \
            -f merge_method=merge)
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | jq -e '.merged == true' >/dev/null
          MERGE_SHA=$(printf '%s' "$RESPONSE" | jq -r '.sha // empty')
          if [ -z "$MERGE_SHA" ]; then
            echo "::error::Merge response did not contain a merge SHA"
            exit 5
          fi
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch Media Pages for exact merge
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$MERGE_SHA"
          gh workflow run media-pages.yml --repo "$REPO" --ref main -f expected_sha="$MERGE_SHA" -f publish_mode=media
