name: Media Auto Merge
run-name: Media Auto Merge · ${{ github.event.workflow_run.head_branch }}

on:
  workflow_run:
    workflows: [Media Command]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: media-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge-normal-data-operation:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'media/op-')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and verify eligible PR
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          OWNER="${REPO%%/*}"
          mapfile -t PR_ROWS < <(
            gh api --method GET "repos/$REPO/pulls" \
              -f state=open \
              -f base=main \
              -f head="$OWNER:$HEAD_BRANCH" \
              --jq '.[] | [.number, .head.sha, .head.repo.full_name, .base.ref] | @tsv'
          )

          if [ "${#PR_ROWS[@]}" -eq 0 ]; then
            echo "No open operation PR remains; nothing to merge."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#PR_ROWS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one open PR for $HEAD_BRANCH"
            exit 2
          fi

          IFS=$'\t' read -r PR_NUMBER PR_HEAD_SHA PR_HEAD_REPO PR_BASE <<< "${PR_ROWS[0]}"
          if [ "$PR_HEAD_REPO" != "$REPO" ] || [ "$PR_BASE" != "main" ]; then
            echo "::error::Only same-repository operation PRs targeting main are eligible"
            exit 3
          fi

          COMMIT_ACTOR=$(gh api "repos/$REPO/commits/$PR_HEAD_SHA" --jq '.author.login // empty')
          if [ "$COMMIT_ACTOR" != "github-actions[bot]" ]; then
            echo "::error::Operation head was not produced by the trusted command workflow"
            exit 3
          fi

          mapfile -t FILES < <(
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::Operation PR has no changed files"
            exit 3
          fi

          OP_MARKERS=()
          for path in "${FILES[@]}"; do
            if [[ "$path" == .media/operations/*.json ]]; then
              OP_MARKERS+=("$path")
            fi
          done
          if [ "${#OP_MARKERS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one applied operation marker"
            exit 3
          fi

          OP_JSON=$(gh api "repos/$REPO/contents/${OP_MARKERS[0]}?ref=$PR_HEAD_SHA" --jq '.content' | tr -d '\n' | base64 --decode)
          if ! OP_STATUS=$(printf '%s' "$OP_JSON" | jq -er '.status'); then
            echo "::error::Operation marker has no valid status"
            exit 3
          fi
          if ! OP_KIND=$(printf '%s' "$OP_JSON" | jq -er '.operation'); then
            echo "::error::Operation marker has no valid operation kind"
            exit 3
          fi
          if [ "$OP_STATUS" != "applied" ]; then
            echo "::error::Operation marker is not applied"
            exit 3
          fi

          POLICY_JSON=$(gh api "repos/$REPO/contents/media/config/operation_path_policy.json?ref=main" --jq '.content' | tr -d '\n' | base64 --decode)
          if ! printf '%s' "$POLICY_JSON" | jq -e '
            .schema_version == 1 and
            (.operations | type == "object") and
            (.operations | length > 0)
          ' >/dev/null; then
            echo "::error::Trusted main operation path policy is invalid"
            exit 3
          fi

          if ! OP_POLICY=$(printf '%s' "$POLICY_JSON" | jq -ce --arg op "$OP_KIND" '.operations[$op] // empty'); then
            echo "::error::Operation kind is absent from trusted main policy: $OP_KIND"
            exit 3
          fi
          if ! printf '%s' "$OP_POLICY" | jq -e '
            .auto_merge == true and
            (.allowed_paths | type == "array") and
            (.allowed_paths | length > 0) and
            ([.allowed_paths[] | select(type != "string" or length == 0)] | length == 0)
          ' >/dev/null; then
            echo "::error::Operation is not eligible under trusted main policy: $OP_KIND"
            exit 3
          fi

          mapfile -t ALLOWED_PATHS < <(printf '%s' "$OP_POLICY" | jq -r '.allowed_paths[]')
          for path in "${FILES[@]}"; do
            matched=false
            for pattern in "${ALLOWED_PATHS[@]}"; do
              if [[ "$path" == $pattern ]]; then
                matched=true
                break
              fi
            done
            if [ "$matched" != true ]; then
              echo "::error::$OP_KIND may not auto-merge path under trusted main policy: $path"
              exit 3
            fi
          done

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for authoritative exact-head Media Check
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CHECKED_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            RUNS=$(gh api --method GET "repos/$REPO/actions/workflows/media-check.yml/runs" \
              -f branch="$HEAD_BRANCH" \
              -f event=workflow_dispatch \
              -f per_page=20)
            RUN_ROW=$(printf '%s' "$RUNS" | jq -r --arg sha "$CHECKED_SHA" \
              'first(.workflow_runs[] | select(.head_sha == $sha)) // empty | [.status, (.conclusion // ""), (.html_url // "")] | @tsv')

            if [ -z "$RUN_ROW" ]; then
              echo "Authoritative Media Check for $CHECKED_SHA has not appeared yet (attempt $attempt/60)."
              sleep 5
              continue
            fi

            IFS=$'\t' read -r RUN_STATUS RUN_CONCLUSION RUN_URL <<< "$RUN_ROW"
            echo "Media Check: status=$RUN_STATUS conclusion=${RUN_CONCLUSION:-pending} $RUN_URL"
            if [ "$RUN_STATUS" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$RUN_CONCLUSION" != "success" ]; then
              echo "::error::Authoritative Media Check did not succeed: $RUN_CONCLUSION"
              exit 4
            fi
            exit 0
          done

          echo "::error::Timed out waiting for authoritative Media Check for $CHECKED_SHA"
          exit 4

      - name: Merge verified normal data operation
        id: merge
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          RESPONSE=$(gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/merge" \
            -f sha="$EXPECTED_SHA" \
            -f merge_method=merge)
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | jq -e '.merged == true' >/dev/null
          MERGE_SHA=$(printf '%s' "$RESPONSE" | jq -r '.sha // empty')
          if [ -z "$MERGE_SHA" ]; then
            echo "::error::Merge response did not contain a merge SHA"
            exit 5
          fi
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch Media Pages for exact merge
        if: ${{ steps.pr.outputs.eligible == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$MERGE_SHA"
          gh workflow run media-pages.yml --repo "$REPO" --ref main -f expected_sha="$MERGE_SHA" -f publish_mode=media
