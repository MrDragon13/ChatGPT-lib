name: Media Check

on:
  pull_request:
    paths:
      - 'media/**'
      - '.media/**'
      - 'tests/media/**'
      - '.github/workflows/media-*.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional exact head SHA expected by the caller
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'media/op-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify expected SHA
        if: ${{ inputs.expected_sha != '' }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install -r media/requirements.txt
      - name: Run project tests
        run: python -m pytest -q
      - name: Validate canonical media
        run: python -m media.tools.validate .
      - name: Check generated artifacts
        run: python -m media.cli rebuild --check
      - name: Run media doctor
        run: python -m media.cli doctor --format json
