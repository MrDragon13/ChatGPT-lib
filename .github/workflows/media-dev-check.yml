name: Media Dev Check

on:
  pull_request:
    paths:
      - 'media/**/*.py'
      - 'media/schemas/**'
      - 'media/commands/schemas/**'
      - 'media/config/operation_path_policy.json'
      - 'media/baselines/**'
      - 'media/pilots/**'
      - 'tests/media/**'
      - '.github/workflows/media-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install -r media/requirements.txt
      - name: Run project tests
        run: python -m pytest -q
      - name: Validate canonical media
        run: python -m media.tools.validate .
      - name: Check generated artifacts
        run: python -m media.cli rebuild --check
      - name: Audit media intelligence reproducibly
        run: |
          python -m media.tools.audit_intelligence . --format json > /tmp/intelligence-audit-1.json
          python -m media.tools.audit_intelligence . --format json > /tmp/intelligence-audit-2.json
          cmp /tmp/intelligence-audit-1.json /tmp/intelligence-audit-2.json
          cat /tmp/intelligence-audit-1.json
      - name: Export web manifest
        run: python -m media.cli web-export --output /tmp/media-web-manifest.json --format json
      - name: Run media doctor
        run: python -m media.cli doctor --format json
