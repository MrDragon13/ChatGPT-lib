name: Media Dev Check

on:
  pull_request:
    paths:
      - 'media/**/*.py'
      - 'media/schemas/**'
      - 'media/commands/schemas/**'
      - 'media/config/operation_path_policy.json'
      - 'media/baselines/**'
      - 'tests/media/**'
      - '.github/workflows/media-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request revision
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: python -m pip install -r media/requirements.txt
      - name: Generate frozen Stage A reassessment ledger candidate
        if: github.event.pull_request.head.ref == 'feat/media-legacy-reassessment-activation'
        run: |
          git fetch --no-tags --depth=1 origin 35afaca898eae6937066f230906b41af0e1f6690
          git worktree add /tmp/chatgpt-lib-stage-a 35afaca898eae6937066f230906b41af0e1f6690
          PYTHONPATH="$PWD" python -m media.tools.reassessment init \
            --repo-root /tmp/chatgpt-lib-stage-a \
            --output /tmp/legacy-reassessment-primary.json \
            --base-revision 35afaca898eae6937066f230906b41af0e1f6690 \
            --baseline-path media/baselines/intelligence-stage-a.json
          python -m media.tools.reassessment summary /tmp/legacy-reassessment-primary.json
      - name: Upload frozen reassessment ledger candidate
        if: github.event.pull_request.head.ref == 'feat/media-legacy-reassessment-activation'
        uses: actions/upload-artifact@v4
        with:
          name: legacy-reassessment-primary-candidate
          path: /tmp/legacy-reassessment-primary.json
          if-no-files-found: error
      - name: Run project tests
        run: python -m pytest -q
      - name: Validate canonical media
        run: python -m media.tools.validate .
      - name: Check generated artifacts
        run: python -m media.cli rebuild --check
      - name: Audit media intelligence reproducibly
        run: |
          python -m media.tools.audit_intelligence . --format json > /tmp/intelligence-audit-1.json
          python -m media.tools.audit_intelligence . --format json > /tmp/intelligence-audit-2.json
          cmp /tmp/intelligence-audit-1.json /tmp/intelligence-audit-2.json
          cat /tmp/intelligence-audit-1.json
      - name: Export web manifest
        run: python -m media.cli web-export --output /tmp/media-web-manifest.json --format json
      - name: Run media doctor
        run: python -m media.cli doctor --format json
