name: Media Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: Read-only maintenance task
        required: true
        default: doctor
        type: choice
        options:
          - doctor
          - rebuild-check

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r media/requirements.txt
      - name: Run selected maintenance check
        shell: bash
        run: |
          if [ "${{ inputs.task }}" = "doctor" ]; then
            python -m media.cli doctor --format json
          else
            python -m media.cli rebuild --check
          fi
