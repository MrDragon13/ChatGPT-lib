    synopsis_short: После двух лет поисков правосудия на улицах Готэма для своих сограждан
      Бэтмен становится олицетворением беспощадного возмездия. Когда в городе происходит
      серия жестоких нападений на представителей элиты, загадочные улики приводят
      Брюса Уэйна в самые темные закоулки преступного мира, где он встречает Женщину-Кошку,
      Пингвина, Кармайна Фальконе и Загадочника. Теперь под прицелом оказывается сам
      Бэтмен, которому предстоит отличить друга от врага и восстановить справедливость
      во имя Готэма.
