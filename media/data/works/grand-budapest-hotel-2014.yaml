    synopsis_short: Картина расскажет о легендарном консьерже популярного европейского
      отеля и проследит за его жизнью между двумя мировыми войнами, а также за его
      дружбой с юным сотрудником, который становится его протеже. Сюжет включает в себя
      кражу бесценной картины эпохи Возрождения, борьбу за огромное наследство и потрясения,
      постигшие Европу во время первой половины XX века.
