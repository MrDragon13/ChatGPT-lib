    synopsis_short: 'Детектив Уильям Сомерсет — ветеран уголовного розыска, мечтающий
      уйти на пенсию и уехать подальше от города и его грешных обитателей. За семь
      дней до пенсии на Сомерсета сваливаются две неприятности: молодой напарник Миллс
      и особо изощренное убийство. Острый ум опытного следователя сразу определяет,
      что за этим преступлением, скорее всего, последуют другие.'
