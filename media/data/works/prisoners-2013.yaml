    synopsis_short: 'Келлер Довер сталкивается с самым большим кошмаром каждого родителя:
      его 6-летняя дочь пропала вместе с подругой. Время бежит, девочки не возвращаются,
      и паника достигает своего предела. Единственная зацепка — обветшалый фургончик,
      который был припаркован на их улице, когда дети играли во дворе. Детектив Локки,
      возглавляющий расследование, арестовывает его водителя, Алекса Джонса, но вскоре
      полиция вынуждена его отпустить из-за нехватки улик. Полиция медлит, а обезумевший
      от горя отец берет дело в свои руки. Но как далеко готов зайти Келлер в поисках
      девочек?'
