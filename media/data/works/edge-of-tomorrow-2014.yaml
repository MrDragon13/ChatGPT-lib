    feedback: &id004
      summary: 'Очень понравился фильм: хорошая графика, крепкий экшен и интересный
        сюжет. Особенно удачно показана временная петля; кажется, мне в целом нравятся
        истории про временные петли. Порадовало, что в итоге вышли на счастливый финал,
