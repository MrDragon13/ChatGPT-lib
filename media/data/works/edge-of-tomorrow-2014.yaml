    synopsis_short: В недалёком будущем раса инопланетян вторгается на Землю. Никакая
      армия в мире не может противостоять им. Майор Уильям Кейдж умирает в бою, но
      случается невозможное - он оказывается во времённой петле. Раз за разом он попадает
      в один и тот же бой, сражается и умирает... снова и снова. И каждое повторяющееся
      сражение приближает его к разгадке того, как победить врага.
