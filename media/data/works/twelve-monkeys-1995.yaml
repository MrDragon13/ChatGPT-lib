    synopsis_short: 2035 год... Чудовищный, неизлечимый вирус уничтожил пять миллиардов
      человек, то есть 99% населения Земли. Оставшиеся в живых люди вынуждены обитать
      под землей. Уголовник Джеймс Коул добровольно отправляется в опасное путешествие
      на машине времени. Он должен попасть в прошлое, чтобы помочь ученым найти источник
      возникновения этого ужасного вируса и раскрыть загадку таинственных «Двенадцати
      обезьян»...
