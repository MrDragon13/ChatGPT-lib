    synopsis_short: Фрэнк Эбегнейл успел поработать врачом, адвокатом и пилотом на
      пассажирской авиалинии — и все это до достижения полного совершеннолетия в 21
      год. Мастер в обмане и жульничестве, он также обладал искусством подделки документов,
      что в конечном счете принесло ему миллионы долларов, которые он получил по фальшивым
      чекам. Агент ФБР Карл Хэнрэтти отдал бы все, чтобы схватить Фрэнка и привлечь
      к ответственности за свои деяния, но Фрэнк всегда опережает его на шаг, заставляя
      продолжать погоню.
