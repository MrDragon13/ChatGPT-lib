    synopsis_short: Вышедший на пенсию автомеханик Уолт Ковальски проводит дни, починяя
      что-то по дому, попивая пиво и раз в месяц заходя к парикмахеру. И хотя последним
      желанием его недавно почившей жены было совершение им исповеди, Уолту — ожесточившемуся
      ветерану Корейской войны, всегда держащему свою винтовку наготове, — признаваться
      в общем-то не в чем. Да и нет того, кому он доверял бы в той полной мере, в
      какой доверяет своей собаке Дейзи.
