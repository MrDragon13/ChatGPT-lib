    synopsis_short: Действие фильма происходит в 2035 г., где роботы являются обычными
      помощниками человека. Главный герой — полицейский, «не переваривающий» роботов,
      расследует дело об убийстве, в которое оказывается вовлечен робот. Речь идет
      о возможном нарушении «Закона о Роботах» (робот никогда не поднимет руки на
      человека), что, в принципе, невозможно. Но если машины могут нарушать этот закон,
      то уже ничто не остановит их от захвата контроля над людьми, тем более, что
      человечество уже давно стало полностью зависимо от роботов…
