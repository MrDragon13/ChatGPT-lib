    synopsis_short: 2057 год. Солнце погибает, и человечество встает перед лицом вымирания.
      Последняя надежда планеты Земля связана с «Икаром 2» — космическим кораблем,
      экипаж которого состоит из восьми мужчин и женщин во главе с капитаном Канедой.
      Их миссия — доставить ядерный заряд, с помощью которого предполагается повторно
      воспламенить гаснущее Солнце.Во время своего путешествия, находясь далеко в
      космическом безмолвии, в отсутствии какого-либо радиоконтакта с Землей, экипаж
      слышит слабые позывные сигналы с космического корабля «Икар 1», который пропал,
      выполняя семь лет назад ту же самую миссию, что и «Икар 2». Ужасная катастрофа
      ввергает миссию в очень опасную и рискованную ситуацию, и скоро команда обнаруживает,
      что вынуждена бороться не только за свои собственные жизни и душевное равновесие,
      но и за будущее всех нас…
