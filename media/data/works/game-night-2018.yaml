    synopsis_short: История Макса и Энни, которые вместе с другими парами каждую неделю
      устраивают так называемые «ночные игры». И вот однажды харизматичный брат Макса
      Брукс организовывает вечер по разгадыванию «убийственного» квеста с «ряжеными»
      головорезами и агентами ФБР. Получается, похищение Брукса в тот вечер — это
      розыгрыш… или нет?  В итоге, по мере того, как шестеро мега-азартных игроков
      пытаются решить заготовленные головоломки и выиграть, они начинают осознавать,
      что и «квест», и Брукс — совсем не такие, как кажутся. В течение всей этой суматошной
      ночи друзья не раз прыгают выше головы, пытаясь выпутаться из очередной передряги.
      В игре нет правил, за нее не начисляются очки, а игроки понятия не имеют, кому
      противостоят. Эта ночь может стать самой зажигательной в их жизни… или последней.
