    synopsis_short: Лента расскажет историю математического гения Кристиана Вульфа,
      который подрабатывает аудитором для самых опасных преступных организаций. Когда
      ему «на хвост» садится отдел по борьбе с преступностью Министерства финансов
      во главе с Рэем Кингом Кристиан решает найти себе законопослушного клиента и
      проводит аудит в компании по производству новейшей робототехники, где сотрудница
      финансового отдела обнаружила «нестыковочку» в миллионы долларов. Но стоит Кристиану
      взяться за счета и выйти на след, как в деле начинают появляться жертвы.
