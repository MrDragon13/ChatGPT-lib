    synopsis_short: Николас Ван Ортон - само воплощение успеха. Он преуспевает, он
      невозмутим и спокоен, привык держать любую ситуацию под контролем. На день рождения
      Николас получает необычный подарок - билет для участия в «Игре». Ему обещают,
      что игра вернет яркие чувства, позволит ощутить вкус и остроту жизни. Вступив
      в игру, Николас начинает осознавать, что это игра всерьез, игра не на жизнь,
      а на смерть.
