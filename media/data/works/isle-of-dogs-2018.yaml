    synopsis_short: История 12-летнего мальчика Атари Кобаяши, опекаемого коррумпированным
      мэром Кобаяши. Когда по Указу последнего все домашние собаки города Мегасаки
      изгоняются на громадную свалку, Атари в одиночку отправляется на миниатюрном
      летательном аппарате на мусорный остров, чтобы найти своего верного пса по прозвищу
      Спотс. Там на острове вместе со стаей новых друзей-дворняг он начнёт эпичное
      путешествие, которое решит будущую судьбу всей Префектуры.
