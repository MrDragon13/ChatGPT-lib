    synopsis_short: Один ушлый американец ещё со студенческих лет приторговывал наркотиками,
      а теперь придумал схему нелегального обогащения с использованием поместий обедневшей
      английской аристократии и очень неплохо на этом разбогател. Другой пронырливый
      журналист приходит к Рэю, правой руке американца, и предлагает тому купить киносценарий,
      в котором подробно описаны преступления его босса при участии других представителей
      лондонского криминального мира — партнёра-еврея, китайской диаспоры, чернокожих
      спортсменов и даже русского олигарха.
