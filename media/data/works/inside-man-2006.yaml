    feedback: &id004
      summary: 'В целом хороший фильм: смотрел с удовольствием, хотя и за несколько
        подходов, по частям. К сегодняшнему дню немного устарел, в особенности не
        понравилась несколько «мыльная» картинка. Финал показался слегка фальшивым
        и неправдоподобным: по сюжету главный герой скрывался за построенной грабителями
        стеной в хранилище, но странно, что за всё время никто не заметил уменьшения
        пространства. Для фильма с упором на реалистичность и продуманность ограбления
        такое допущение в развязке выглядит неубедительно. Поведение полиции тоже
        местами показалось абсурдным и нелогичным. Несмотря на замечания, просмотр
        принёс удовольствие.'
