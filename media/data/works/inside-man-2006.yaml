    synopsis_short: История крутого полицейского, детектива Фрезьера, который сталкивается
      «на узкой дорожке» с хитрым грабителем банков Долтоном. Их противостояние выливается
      в напряженную драму с захватом заложников. По мере того, как развивается эта
      игра в «кошки-мышки», на горизонте появляется еще одна загадочная фигура — брокер
      Мадалина, роль которой в разворачивающихся событиях остается до поры до времени
      совершенно непонятной. Мадалина вносит еще больше хаоса и нестабильности в и
      без того чрезвычайно хрупкую ситуацию…
