    synopsis_short: Наполеон Соло — агент ЦРУ, на счету которого огромное количество
      успешно проведенных операций. Он считается одним из лучших секретных агентов
      во всем мире, и с ним может сравниться только один человек — самый молодой и
      перспективный агент КГБ Илья Курякин. Их противостояние переросло в настоящую
      войну, в которой никто не собирается уступать. Однако обстоятельства складываются
      так, что непримиримые враги вынуждены стать напарниками. Это происходит после
      того, как спецслужбы двух стран обнаруживают международную преступную организацию,
      которой удалось создать ядерную бомбу.
