    synopsis_short: 'Хотя холодная война давно закончена, тайные наемники, чьи навыки
      в слежке, шпионаже и силовых схватках буквально легендарны, остаются востребованными
      при новом мировом порядке и всегда находят высокооплачиваемую работу. Некий
      таинственный клиент собирает в Париже команду таких «платных оперативников»,
      известных как «Ронины», для похищения сверхсекретного портфеля.Вскоре выясняется,
      что это, на первый взгляд простое, задание почти невыполнимо: та же цена обещана
      за тот же портфель еще нескольким нелегальным группам...'
