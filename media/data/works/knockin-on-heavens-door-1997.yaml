    synopsis_short: Судьба сводит героев картины в больнице, где врачи выносят им смертный
      приговор. Счёт времени их жизней идёт на часы. Дальнейшие события в фильме разворачиваются
      в стремительном темпе. Украв машину с миллионом немецких марок в багажнике,
      они сбегают из больницы. Их преследуют наёмные убийцы, они становятся грабителями
      поневоле, за ними гонится полиция, они попадают в бордель. Но тем не менее продолжают
      мчаться вперёд, навстречу своей Судьбе.
