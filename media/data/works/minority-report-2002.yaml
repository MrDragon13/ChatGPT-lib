    synopsis_short: "2054 год. Уже шесть лет существует особый предпреступный отдел.\
      \ На основе психических технологий разработана экспериментальная программа,\
      \ с помощью которой работники отдела могут узнать о еще не совершенном убийстве\
      \ и арестовать подозреваемого еще до совершения им преступления.\r Такая система\
      \ осуждения преступников и предотвращения преступлений получает все большее\
      \ распространение. Эта система работает идеально, но самое страшное начинается\
      \ тогда, когда ты сам оказываешься обвиненным в еще не совершенном убийстве.\r\
      \ Однажды руководитель предпреступного отдела Джон Андертон сам оказывается\
      \ подозреваемым преступником. Он обвиняется в том, что совершит убийство человека,\
      \ которого пока он даже не знает.\r Джон не верит в это, но теперь он вынужден\
      \ сам скрываться от своих коллег. Единственная для него возможность доказать\
      \ свою невиновность - это показать, что новая программа допускает ошибки и отнюдь\
      \ не так идеальна, как этого хотелось бы многим..."
