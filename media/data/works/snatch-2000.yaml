    synopsis_short: «Фрэнки Четыре Пальца» должен был переправить краденый алмаз из
      Англии в США своему боссу Эви, но, сделав ставку на подпольный боксёрский поединок,
      он попал в круговорот весьма нежелательных событий. Вокруг него и его груза
      разворачивается сложная интрига с участием множества колоритных персонажей лондонского
      дна - русского гангстера, троих незадачливых грабителей, хитрого боксёра и угрюмого
      громилы грозного мафиози. Каждый норовит в одиночку сорвать большой куш.
