    synopsis_short: Сэм Белл работает по контракту на поверхности Луны. Он обслуживает
      два харвестера, добывающие гелий-3 - сырье будущего, энергетическое счастье
      человечества. Он один на этой унылой планете, где вся цветовая гамма - оттенки
      серого. Срок его контракта - три года. За это время на Земле родилась и подросла
      дочь. Жена ждет и гордится. Однако так ли все на самом деле? Бродя по белым
      лабиринтам лунной станции, Сэм начинает подозревать, что его собственный робот
      утаивает от него ключевую часть правды, что его контракт не окончится так просто,
      и что, в конце концов, он - не единственный Сэм Белл в этом мире.
