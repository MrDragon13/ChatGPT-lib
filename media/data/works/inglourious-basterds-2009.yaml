    synopsis_short: Действие картины разворачивается в оккупированной Франции. На
      глазах у Сюзанны Дрейфус от рук немецкого полковника Ганса Ланда погибает ее
      семья. Девушке чудом удается спастиcь и бежать в Париж. Там она устраивается
      на работу в кинотеатр. В это же время где-то в Европе лейтенант Альдо Рэйн собирает
      группу еврейских солдат, именующих себя «Ублюдками». К ним примыкает тайный
      агент Бриджет фон Хаммерсмарк, выдающая себя за актрису. Обе сюжетные линии
      пересекаются, когда диверсанты встречаются в кинотеатре с Сюзанной, мечтающей
      отомстить обидчикам.
