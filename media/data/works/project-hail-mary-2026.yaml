    feedback: &id004
      summary: 'Хороший интересный фильм, который с удовольствием посмотрел уже несколько
        раз. Во многом очень похож на «Марсианина»: плотный интересный сюжет, органичный
        остроумный юмор и находчивый главный герой, решающий проблемы. Визуальная
        часть даже чуть более впечатляющая, чем в «Марсианине»; особенно понравилась
        сцена с разноцветными частицами в открытом космосе. При этом повествование
        несколько более затянуто, поэтому ставлю 8,5/10 — немного ниже оценки «Марсианина»
