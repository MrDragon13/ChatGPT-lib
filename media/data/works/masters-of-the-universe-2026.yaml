    synopsis_short: Адам, 10-летний принц с планеты Этерния, терпит крушение на космическом
      корабле и попадает на Землю. Спустя 15 лет принц отправляется на родную планету,
      которая теперь находится под гнётом Скелетора. Чтобы одолеть опасного противника,
      Адаму предстоит раскрыть своё прошлое, объединить силы с союзниками и стать
      Хи-Меном — самым могущественным человеком во Вселенной.
