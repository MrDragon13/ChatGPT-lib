    synopsis_short: 'Прошло семь месяцев, а виновный в убийстве её дочери так и не
      найден. Тогда Милдред Хейз решает пойти на смелый шаг: она расписывает три рекламных
      щита на въезде в город, разместив на них провокационное послание, адресованное
      Биллу Уиллоуби, уважаемому начальнику полиции города. Когда в дело вмешивается
      его заместитель, офицер Джейсон Диксон — незрелый «маменькин сынок» со склонностью
      к насилию, — конфликт между Милдред и правоохранительными органами Эббинга только
      обостряется.'
