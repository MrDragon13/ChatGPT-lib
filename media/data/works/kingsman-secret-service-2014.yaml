    synopsis_short: Эггси — молодой парень, который прошел службу в морской пехоте
      и имеет очень высокий уровень интеллекта. Он мог бы добиться многого, но выбрал
      другой путь и стал мелким преступником. Однажды он знакомится с Гарри Хартом,
      которому его отец когда-то спас жизнь. Этот человек решил сделать все возможное,
      чтобы сделать жизнь Эггси лучше и открыть для него новые возможности.  Гарри
      рассказал ему, что является агентом секретной независимой организации, которая
      стоит на защите всего мира. Он предложил парню пройти обучение и стать новым
      членом их команды. Эггси принял предложение Харта, но сможет ли он справиться
      со всеми испытаниями и оправдать его надежды?..
