    synopsis_short: Наследник знаменитого дома Атрейдесов Пол отправляется вместе
      с семьей на одну из самых опасных планет во Вселенной — Арракис. Здесь нет ничего,
      кроме песка, палящего солнца, гигантских чудовищ и основной причины межгалактических
      конфликтов — невероятно ценного ресурса, который называется меланж. В результате
      захвата власти Пол вынужден бежать и скрываться, и это становится началом его
      эпического путешествия. Враждебный мир Арракиса приготовил для него множество
      тяжелых испытаний, но только тот, кто готов взглянуть в глаза своему страху,
      достоин стать избранным.
