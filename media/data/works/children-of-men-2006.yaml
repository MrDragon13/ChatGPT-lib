    synopsis_short: 2027 год. Мир погряз в анархии, причиной которой стало массовое
      бесплодие. Над человечеством нависла угроза полного вымирания. Лишенный иллюзий
      бюрократ превращается в чемпиона гонки на выживание в Лондоне, раздираемом клановыми
      войнами противоборствующих группировок. Именно он встает на защиту «последней
      надежды человечества» — беременной женщины, которую надо доставить в безопасное
      место под присмотр врачей…
