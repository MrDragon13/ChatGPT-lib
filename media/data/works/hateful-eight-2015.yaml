    synopsis_short: 'США после Гражданской войны. Легендарный охотник за головами
      Джон Рут по кличке Вешатель конвоирует заключенную. По пути к ним прибиваются
      еще несколько путешественников. Снежная буря вынуждает компанию искать укрытие
      в лавке на отшибе, где уже расположилось весьма пёстрое общество: генерал конфедератов,
      мексиканец, ковбой… И один из них — не тот, за кого себя выдает.'
