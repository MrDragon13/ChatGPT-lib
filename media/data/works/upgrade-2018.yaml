    synopsis_short: 2046 год. Разнообразные технологии участвуют во всех аспектах
      человеческой жизни. Но в этом технологичном мире Грей — один из немногих людей,
      кто любит работать руками. Он восстанавливает и чинит старые автомобили. Однажды,
      возвращаясь от клиента, Грей с женой попадают в аварию, а после — в руки банды
      отморозков, в результате чего женщина погибает, а Грей оказывается парализованным
      ниже шеи. Тот самый богатый клиент предлагает несчастному поставить экспериментальный
      имплант Stem, который может полностью восстановить подвижность.
