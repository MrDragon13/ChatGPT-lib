    synopsis_short: Обычное корейское семейство Кимов жизнь не балует. Приходится
      жить в сыром грязном полуподвале, воровать интернет у соседей и перебиваться
      случайными подработками. Однажды друг сына семейства, уезжая на стажировку за
      границу, предлагает тому заменить его и поработать репетитором у старшеклассницы
      в богатой семье Пак. Подделав диплом о высшем образовании, парень отправляется
      в шикарный дизайнерский особняк и производит на хозяйку дома хорошее впечатление.
      Тут же ему в голову приходит необычный план по трудоустройству сестры.
