    synopsis_short: Более 20 лет назад инопланетяне установили первый контакт с Землей.
      Люди были готовы ко всему — от враждебного вторжения до невероятного технологического
      прорыва. Ни того, ни другого не произошло. Пришельцы оказались беженцами со
      своей собственной планеты, и пока мировое сообщество решало, что с ними делать
      дальше, для них был организован временный лагерь в южноафриканском Районе №
      9.
