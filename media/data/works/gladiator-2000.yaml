    synopsis_short: Римская империя. Бесстрашного и благородного генерала Максимуса
      боготворят солдаты, а старый император Марк Аврелий безгранично доверяет ему
      и относится как к сыну. Однако опытный воин, готовый сразиться с любым противником
      в честном бою, оказывается бессильным перед коварными придворными интригами.
      Коммод, сын Марка Аврелия, убивает отца, который планировал сделать преемником
      не его, а Максимуса, и захватывает власть. Решив избавиться от опасного соперника,
      который к тому же отказывается присягнуть ему на верность, Коммод отдаёт приказ
      убить Максимуса и всю его семью. Чудом выжив, но не сумев спасти близких, Максимус
      попадает в плен к работорговцу, который продаёт его организатору гладиаторских
      боёв Проксимо. Так легендарный полководец становится гладиатором. Но вскоре
      ему представится шанс встретиться со своим смертельным врагом лицом к лицу.
