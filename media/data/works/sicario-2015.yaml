    synopsis_short: "Безлюдные пустоши, по которым проходит граница между Мексикой\
      \ и США, — это территория без правил, поле битвы между мексиканскими наркокартелями\
      \ и американскими спецслужбами. Агент ФБР Кейт Мэйсер, которая работает в приграничных\
      \ районах, старается придерживаться собственных идеалов, хотя и начинает ощущать,\
      \ что исход войны с наркотрафиком складывается не в пользу служителей закона.\r\
      \ Однажды ей предоставляется шанс принять участие в работе элитного подразделения\
      \ по борьбе с наркотиками, возглавляемого агентом Мэттом Грейвером. Самый загадочный\
      \ участник команды — местный консультант, человек без имени, привычек, и, кажется,\
      \ без прошлого. Его истинное лицо откроется только в ходе рискованной операции,\
      \ во время которой Кейт будет вынуждена поступиться собственными принципами,\
      \ чтобы остаться в живых."
