    synopsis_short: Фильм рассказывает историю Виктора Наворски, отправившегося в
      Нью-Йорк из Восточной Европы. Пока Виктор летел в самолете, на его родине произошел
      государственный переворот. Оказавшись в международном аэропорту имени Джона
      Кеннеди с паспортом ниоткуда, он не имеет права въехать в Соединенные Штаты
      и должен коротать свои дни и ночи на скамейках у выхода 67, пока война в его
      родной стране не закончится. Тянутся недели и месяцы, и Виктор обнаруживает,
      что небольшой мирок терминала может быть наполнен абсурдом, щедростью, амбициями,
      развлечениями, желанием сохранить свой статус, интуитивной прозорливостью и
      даже любовью к очаровательной стюардессе Амелии. Виктору удается завоевать симпатии
      всех, кроме одного человека — чиновника аэропорта Фрэнка Диксона, который считает
      его бюрократической ошибкой, проблемой, которую он не может контролировать,
      но от которой жаждет избавиться.
