    synopsis_short: Нью-йоркский писатель Эдди, желая преодолеть чёрную полосу в жизни,
      принимает засекреченный препарат под названием NZT. Таблетка выводит мозг парня
      на работу в нереальной мощности. Этот творческий наркотик меняет всю жизнь Эдди,
      за короткий срок он зарабатывает кучу денег, но скоро начинает страдать от зловещих
      побочных эффектов препарата. А когда пытается найти других NZT-гениев, чтобы
      понять, как можно справиться с этим пристрастием, он узнает страшную правду…
