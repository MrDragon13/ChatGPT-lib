    synopsis_short: Америка находится на грани экономического кризиса, который накроет
      все передовые страны мира. Однако главные финансисты страны пока не замечают
      надвигающейся опасности и уверены, что все абсолютно нормально. Существует всего
      несколько человек, которые убеждены в том, что совсем скоро наступит финансовый
      крах. Они сумели вовремя сориентироваться и сыграть на приближающемся кризисе.
      Объединив свои усилия, эти люди смогли воспользоваться своим шансом и заработали
      миллионы долларов...
