    synopsis_short: 4 июля 1969 года неизвестный расстреливает влюблённую парочку
      на окраине города Вальехо в штате Калифорния. Месяц спустя в издательства крупных
      газет начинают приходить зашифрованные письма, в которых убийца, называющий
      себя Зодиаком, угрожает убить ещё 12 человек, если текст письма, содержащий
      тайну его личности, не будет опубликован на передовице. Помимо полицейских из
      разных штатов к расследованию подключаются матёрый репортёр San Francisco Chronicle
      Пол Эйвери и молодой карикатурист Роберт Грейсмит, работающий в той же газете.
      Вскоре убийца наносит новый удар.
