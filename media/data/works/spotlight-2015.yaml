    synopsis_short: История о скандале, который потряс мир. Фильм основан на реальной
      истории о расследовании, проведенном журналистами газеты "The Boston Globe".
      В редакцию городской газеты из анонимного источника поступила информация о якобы
      имевших место случаях педофилии, которые происходят в местной митрополии. Служителей
      церкви аноним обвиняет в том, что те подвергают насилию детей, многие из которых
      – сироты. Однако доказательств нет, и ведущие журналисты приступают к расследованию.
      В назревающем скандале оказываются замешанными не только обычные священники,
      но и городской архиепископ. Не потому ли так неохотно идут на контакт свидетели,
      что попросту боятся?
