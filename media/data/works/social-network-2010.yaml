    synopsis_short: Октябрьский вечер 2003 года. Студента Гарварда Марка Цукерберга
      бросает его девушка. Раздосадованный Марк, подогретый алкоголем, решает отомстить
      и публикует злобный и оскорбительный пост в адрес бывшей подруги. Но этого парню
      показалось мало. Он решает создать сайт, позволяющий сформировать рейтинг студенток
      по степени привлекательности. Марк взламывает базы данных различных общежитий,
      скачивает фотографии и всю необходимую информацию, используя алгоритм, предложенный
      его другом Эдуардо. После сбора данных Марк создаёт страницу facemash.com, где
      студенты могут проголосовать за одну из двух девушек, которая по их мнению является
      более привлекательной. Так начинается история создания одной из крупнейшей социальных
      сетей мира, которая впоследствии получит название Facebook.
