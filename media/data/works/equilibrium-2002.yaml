    feedback: &id004
      summary: 'Очень стильная антиутопия, 9/10. Сюжет не особенно оригинальный, но
        достаточно хороший и интересный; увлекательно наблюдать за развитием главного
        героя от блюстителя и фактически карателя режима до мятежника. Главная причина
        высокой оценки — одни из лучших экшен-сцен, которые я вообще видел: выдающаяся
        постановка стрельбы и драк, красивые ракурсы, общая визуальная стилистика
        и отличный темп. Боевые сцены других фильмов часто сравниваю именно с «Эквилибриумом»
        — он для меня эталон экшен-постановки.'
