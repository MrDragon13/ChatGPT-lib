    synopsis_short: Действие происходит в будущем, когда люди лишены возможности выражать
      какие-то эмоции, потому, что они… запрещены. Это - та цена, которую человечество
      платит за устранение из своей жизни войны. Теперь книги, искусство и музыка
      находятся вне закона. А любое чувство - уже преступление, наказуемое смертью.
      Агент Джон Престон борется с теми, кто нарушает правила. В один прекрасный момент
      он забывает принять очередную дозу лекарства и с ним происходит духовное превращение,
      что приводит его к противоречию с самим собой и с начальством.
