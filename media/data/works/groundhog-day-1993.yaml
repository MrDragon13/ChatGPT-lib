    synopsis_short: 'Телевизионный комментатор Фил Коннорс каждый год приезжает в
      маленький городок в штате Пенсильвания на празднование Дня сурка. Но на этот
      раз веселье рискует зайти слишком далеко. Время сыграло с ним злую шутку: оно
      взяло да и остановилось. Теперь на календаре Фила чернеет одна и та же дата
      - 2 февраля, из которой он никак не может выбраться. Неунывающий ведущий пытается
      извлечь выгоду из своего комичного положения: впереди у него уйма времени и
      безмятежное предсказуемое будущее. Отныне с ним не случится ничего плохого...
      и ничего хорошего. У Фила осталась одна заветная мечта, простая и незамысловатая
      - 3 февраля...'
