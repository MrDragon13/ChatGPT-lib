    synopsis_short: 'Роковое стечение обстоятельств неожиданно наносит мощный удар
      по блестящей карьере и счастливой семейной жизни адвоката Роберта Дина: его
      обвиняют в убийстве, которого он не совершал. Дин понимает, что это связано
      с политическими интригами общенационального масштаба. Его противником оказывается
      руководитель крупного департамента Агентства национальной безопасности Томас
      Брайан Рейнольдс. Дина лишают престижной высокооплачиваемой работы, семьи; из
      всех электронных баз удаляют его личные данные.'
