    synopsis_short: Каждый из нас хотя бы раз в жизни испытывал эффект дежа вю, когда
      нам вдруг начинает казаться, что мы знакомы с людьми, которых на самом деле
      раньше никогда не видели, и уже бывали в местах, где на самом деле никогда не
      были. И, возможно, в такие моменты кому-то приходила в голову мысль, что эти
      ощущения — не что иное, как предупреждения, посланные нам из прошлого, а может
      быть, и ключ к познанию будущего.Агент АТФ Даг Карлин получает возможность совершать
      путешествия во времени, расследуя обстоятельства взрыва, произошедшего на новоорлеанском
      пароме. Оказавшись в прошлом, он встречает женщину, которую должны убить, и
      в итоге влюбляется в нее…
