    synopsis_short: Недалекое будущее. 17 лет назад на планете произошла техногенная
      катастрофа. Там, где раньше росли леса и цвели сады, теперь лежат снег и лёд,
      и жизнь сохранилась лишь в гигантском поезде, без остановки мчащемся по трансевразийской
      магистрали. В первых вагонах состава живёт правящая элита, в последних — простые
      люди. Жизнь в хвосте поезда напоминает концлагерь — болезни, нищета и беспредел
      надсмотрщиков. Именно здесь из среды униженных и оскорблённых восстает человек,
      жаждущий восстановить справедливость.
