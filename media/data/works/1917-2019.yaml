    synopsis_short: 6 апреля 1917 года, разгар Первой мировой войны, Западный фронт
      на севере Франции. Британский генерал поручает капралу Блэйку и его сослуживцу
      смертельно опасную миссию. Они должны пересечь вражескую территорию, вроде бы
      оставленную германскими войсками, и доставить приказ об отмене наступления во
      2-й батальон Девонширского полка, иначе 1600 солдат попадут в ловушку противника,
      в том числе и брат Блэйка.
