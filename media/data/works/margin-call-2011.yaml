    synopsis_short: 'Сентябрь 2008 года. Мировой экономический кризис уже начался,
      но Америка еще не знает, какая катастрофа ждет впереди, и только группа топ-менеджеров
      на Уолл-Стрит ищет рецепт спасения. Это были самые страшные часы в их жизни…
      Сотрудник одного из крупнейших инвестиционных банков Lehman Brothers с помощью
      новейшей программы рыночного анализа получает ошеломляющий прогноз — акции упадут,
      рынок рухнет, банк потеряет все. Утром следующего дня он попадает под сокращение
      и перед уходом передает флэшку с опасной информацией своему бывшему помощнику.
      К вечеру лучшие аналитики банка, проверив эти вычисления, осознали ужасную перспективу:
      крах неминуем. Теперь они стоят перед выбором: начать срочный сброс акций, что
      оставит и крупных акционеров во всем мире, и миллионы рядовых вкладчиков ни
      с чем — или ждать развития событий, что чревато потерей вообще всего. Решать
      нужно здесь и сейчас. На кону — огромные деньги и будущее каждого. В эту ночь
      у риска нет предела…'
