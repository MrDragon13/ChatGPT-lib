    synopsis_short: Астронавт Райленд Грейс просыпается на космическом корабле, не
      помня ни себя, ни свою миссию. Постепенно мужчина приходит к выводу, что он
      — единственный выживший из экипажа, отправленного в звёздную систему Тау Кита
      в поисках спасения от катастрофы на Земле. Райленду предстоит положиться на
      свои обширные научные знания, изобретательность и силу воли, но, возможно, ему
      не придётся искать в одиночку.
