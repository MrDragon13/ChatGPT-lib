    synopsis_short: Во время Второй мировой войны из Италии в концлагерь были отправлены
      евреи - отец с маленьким сыном. Жена-итальянка добровольно последовала за ними.
      В лагере отец сказал мальчику, что всё происходящее вокруг является большой
      интересной игрой за приз в виде настоящего танка. И этот классный приз достанется
      тому мальчику, который сможет не попасться на глаза надзирателям.
