    synopsis_short: Вена. Начало 20 века. В городе появляется загадочный человек,
      называвший себя иллюзионистом Эйзенхаймом. Он показывает публике невиданные
      фокусы, которые кажутся не иначе как волшебством. Слава о необыкновенном чародее
      доходит до кронпринца Леопольда, который почтил своим присутствием одно из представлений
      Эйзенхайма. Леопольда сопровождает его будущая невеста Софи. Её появление в
      зале дает толчок для целой вереницы необъяснимых событий, корни которых уходят
      в прошлое…
