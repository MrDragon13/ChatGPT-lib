    synopsis_short: 'Добро пожаловать в Гаттаку — совершенный мир будущего. Здесь
      каждый генетически запрограммирован, и печальная судьба ожидает тех, кто был
      рожден в любви, а не в лаборатории. Такова судьба Винсента Фримана, молодого
      человека, получившего при рождении ярлык «не пригоден». Винсент обладает весомыми
      недостатками: он подвержен страстям, он поддается эмоциям, и он верит в то,
      что его мечты сбудутся. Вот почему он покупает личность другого человека, пытаясь
      обмануть власти и стать уважаемым членом Корпорации Будущего Гаттака. И когда
      он уже на пути к свободе, убийство грозит раскрытием его реальной личности.
      Несмотря на свою невиновность, Винсенту есть что скрывать и есть что терять.
      Но так трудно остаться в живых, когда в тебе живут два человека…'
