    synopsis_short: "Герой этой картины, Чак Нолан, — сотрудник всемирно известной\
      \ службы доставки «Federal Express». Чак — скрупулёзный практик и неисправимый\
      \ педант. Жизнь Нолана, высокопоставленного инспектора международных отделений\
      \ «FedEx» расписана по минутам. И этих драгоценных минут катастрофически не хватает\
      \ ни на личную жизнь, ни на любимую женщину.\r Однако, безжалостная судьба заставила\
      \ Нолана иначе взглянуть на отпущенное ему время... Самолёт, на котором путешествует\
      \ Чак, падает в океан. Инженер, единственный, кому посчастливилось остаться\
      \ в живых, попадает на необитаемый остров. Здесь Нолану предстоит провести мучительно\
      \ долгие годы в жестокой битве за выживание..."
