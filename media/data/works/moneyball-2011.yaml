    synopsis_short: 2001 год. Менеджер бейсбольной команды Oakland Athletics Билли
      Бин после проигрыша в ключевом матче команде New York Yankees, которая обладает
      значительно большим бюджетом, решает в корне изменить систему подбора игроков.
      Во время деловой поездки в Кливленд он знакомится с молодым выпускником Йеля,
      экономистом Питером Брэндом, который при помощи математических расчётов предлагает
      внедрить новаторскую схему оценки полезности игроков, основываясь на показателях
      их личной статистики.
