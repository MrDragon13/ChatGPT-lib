    synopsis_short: Микки Холлер – блестящий и удачливый адвокат из Лос-Анджелеса,
      чей яркий имидж и образ жизни отлично дополняет его любимая машина «Линкольн».
      Очередное дело – нападение богатого клиента Луи Руле на проститутку сначала
      казалось легким, и он без труда добился оправдательного приговора для подзащитного.
      Но вскоре Микки понимает, что его клиент скрывает правду. Пока Холлер пытается
      вывести Руле на чистую воду, его подставляют по-крупному, и теперь уже угроза
      тюремного заключения нависает над самим Холлером.
