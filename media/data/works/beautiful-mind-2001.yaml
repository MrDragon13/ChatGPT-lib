    synopsis_short: От всемирной известности до греховных глубин — все это познал
      на своей шкуре Джон Форбс Нэш-младший. Математический гений, он на заре своей
      карьеры сделал титаническую работу в области теории игр, которая перевернула
      этот раздел математики и практически принесла ему международную известность.
      Однако буквально в то же время заносчивый и пользующийся успехом у женщин Нэш
      получает удар судьбы, который переворачивает уже его собственную жизнь.
