    synopsis_short: Неожиданное появление неопознанных летающих объектов в разных
      точках планеты повергает мир в трепет. Намерения пришельцев не ясны — вооружённые
      силы всего мира приведены в полную боевую готовность, а лучшие умы человечества
      пытаются понять, как разговаривать с непрошеными гостями. Правительство обращается
      за помощью к лингвисту Луизе Бэнкс и физику Яну Доннели, чтобы предотвратить
      глобальную катастрофу и найти общий язык с пришельцами. Отныне судьба человечества
      находится в их руках.
