    synopsis_short: Сразу после празднования 85-летия, знаменитого автора детективов
      Харлана Тромби находят мёртвым в собственном особняке. Расследовать загадочную
      смерть берётся обаятельный и проницательный детектив Бенуа Блан. Ему предстоит
      распутать хитросплетения обмана, жадности и семейных тайн, окутавших этот дом,
      где каждый может оказаться подозреваемым, а правда — куда опаснее, чем кажется.
