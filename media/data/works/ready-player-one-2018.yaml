    synopsis_short: Действие фильма происходит в 2045 году, мир погружается в хаос
      и находится на грани коллапса. Люди ищут спасения в игре OASIS — огромной вселенной
      виртуальной реальности. Ее создатель, гениальный и эксцентричный Джеймс Холлидэй,
      оставляет уникальное завещание. Все его колоссальное состояние получит игрок,
      первым обнаруживший цифровое «пасхальное яйцо», которое миллиардер спрятал где-то
      на просторах OASISа. Запущенный им квест охватывает весь мир. Совершенно негероический
      парень по имени Уэйд Уоттс решает принять участие в состязании, с головой бросаясь
      в головокружительную, искажающую реальность погоню за сокровищами по фантастической
      вселенной, полной загадок, открытий и опасностей.
