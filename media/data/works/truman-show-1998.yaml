    synopsis_short: Представьте себе, что вы вдруг начинаете понимать, что всё вокруг
      вас - декорации, а люди - актёры, притворяющиеся теми, кем они вам кажутся.
      Весь ваш мир оказывается большим телесериалом, где вы исполняете главную роль,
      даже не подозревая об этом. Вся ваша жизнь - результат работы автора телешоу,
      которое вот уже тридцать лет смотрит вся планета, начиная с момента вашего рождения.
      В такой ситуации оказался Труман, главный герой картины. Будет ли он продолжать
      жить в безопасном мире, где, как он теперь знает, у него практически нет свободы
      выбора, или все-таки выйдет из «игры» и станет сам хозяином своей судьбы, в
      которой его ждет не запланированная сценарием девушка?
