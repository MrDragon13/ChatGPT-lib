    synopsis_short: Безнадёжный романтик Беар давно и безответно влюблён в красавицу
      Ники. Однажды в магазине эзотерики он находит странную безделушку — волшебную
      палочку. Если её сломать, исполнится твоё заветное желание. Беар загадывает,
      чтобы Ники любила его больше всех на свете. И девушка правда в него влюбляется.
      Однако его счастью быстро приходит конец. Парень замечает, что Ники буквально
      им одержима, а её знаки внимания становятся всё более пугающими. Оказывается,
      желание парня исполнилось, но совсем не так, как он мечтал.
